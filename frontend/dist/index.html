    <title>EasyGest — Ventes &amp; Stock</title>
    <script>
      (function () {
        var token = new URL(location.href).searchParams.get("eg_boot") || "";
        var errors = [];
        var mounted = false;
        var sent = false;
        function flush() {
          var api = window.pywebview && window.pywebview.api;
          if (!api) return;
          while (errors.length && typeof api.frontend_error === "function") {
            Promise.resolve(api.frontend_error(errors.shift(), token)).catch(function () {});
          }
          if (mounted && !sent && typeof api.frontend_ready === "function") {
            sent = true;
            Promise.resolve(api.frontend_ready(token)).catch(function () { sent = false; });
          }
        }
        function report(message) {
          if (errors.length < 20) errors.push(String(message).slice(0, 1500));
          flush();
        }
        function path(value) {
          try { return new URL(value, location.href).pathname; } catch (_) { return ""; }
        }
        window.__easygestStartup = { mounted: function () { mounted = true; flush(); } };
        window.addEventListener("pywebviewready", flush);
        window.onerror = function (message, source, line) {
          report(String(message) + " [" + path(source) + ":" + line + "]");
          return false;
        };
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
            report("Ressource frontend indisponible: " + path(target.src || target.href));
          }
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          report("Promise frontend: " + String(event.reason && event.reason.message || event.reason));
        });
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) { return registration.unregister(); })).then(function () {
              return window.caches ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              }) : null;
            }).then(function () {
              if (registrations.length && navigator.serviceWorker.controller) location.reload();
            });
          }).catch(function (error) { report("Nettoyage service worker: " + error.message); });
        }
      })();
    </script>

    <!-- Splash shown until React mounts: on modest machines the bundle takes a
         few seconds, and a branded screen reads far better than a blank page. -->
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f2a5c;color:#fff;font-family:Arial,Helvetica,sans-serif">

        <div style="margin-top:18px;font-size:20px;font-weight:700;letter-spacing:.04em">EasyGest</div>
        <div style="margin-top:6px;font-size:13px;opacity:.75">Chargement en cours…</div>
      </div>
      <style>@keyframes egspin{to{transform:rotate(360deg)}}</style>
    </div>
