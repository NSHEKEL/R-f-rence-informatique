name: Build Windows package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check the tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          declared=$(grep -oP 'APP_VERSION = "\K[^"]+' backend/app/version.py)
          if [ "v$declared" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} != APP_VERSION v$declared" >&2
            exit 1
          fi
          echo "APP_VERSION=$declared" >> "$GITHUB_ENV"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build the application
        run: |
          python packaging/make_version_info.py
          pyinstaller packaging/EasyGest.spec

      - name: Check the executable really starts
        shell: pwsh
        run: |
          # Runs the packaged application: the server must answer and the
          # native window backend (pywebview + pythonnet + WinForms) must load,
          # otherwise the .exe would silently do nothing on the user's PC.
          $log = "$env:APPDATA\EasyGest\easygest.log"
          if (Test-Path $log) { Remove-Item $log }
          # A windowed executable detaches immediately: wait for it explicitly.
          $run = Start-Process -FilePath dist\EasyGest.exe `
            -ArgumentList '--selftest' -PassThru -Wait
          if (Test-Path $log) { Get-Content $log }
          if ($run.ExitCode -ne 0) {
            throw "EasyGest.exe ne démarre pas (code $($run.ExitCode))"
          }

      - name: Download the WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "packaging/MicrosoftEdgeWebview2Setup.exe"

      - name: Build the Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/app/version.py `
            -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" packaging\EasyGest.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyGest-windows
          path: |
            dist/EasyGest.exe
            dist/EasyGest_Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EasyGest_Setup.exe
            dist/EasyGest.exe
          name: EasyGest ${{ github.ref_name }}
          body: |
            **EasyGest — gestion de vente et de stock.**

            - `EasyGest_Setup.exe` : installateur Windows (recommandé).
              Raccourci Bureau et menu Démarrer, l'application s'ouvre dans sa
              propre fenêtre, sans navigateur ni fenêtre noire.
            - `EasyGest.exe` : version portable, à lancer sans installation.

            Comptes de démonstration (base vierge) :
            - Administrateur : admin@reference.ci / admin123
            - Vendeur : vendeur@reference.ci / vendeur123

            Les données restent dans `%APPDATA%\EasyGest` : elles survivent aux
            mises à jour, désinstallations et réinstallations.

            **Mise à jour d'un poste existant :** Paramètres → Mise à jour de
            l'application → Rechercher → Installer.
